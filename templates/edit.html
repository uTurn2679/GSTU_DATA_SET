{% extends "base.html" %}

{% block title %}Edit Donor - {{ donor.name }} - GSTU Blood Donor Database{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-gray-900">Edit Donor Details</h2>
            <p class="text-sm text-gray-500 mt-1">Updating information for <span class="font-semibold text-brand-700">{{ donor.name }}</span></p>
        </div>
        <a href="{{ url_for('index') }}" class="px-3 py-1.5 text-xs font-semibold text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back to List
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:p-8">
        <form method="POST" action="{{ url_for('edit_donor', id=donor.id) }}" class="space-y-6">
            
            <!-- Full Name -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
                <input type="text" name="name" value="{{ donor.name }}" required
                       class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <!-- Dept & Session Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Department <span class="text-red-500">*</span></label>
                    <input type="text" name="department" value="{{ donor.department }}" required
                           class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Academic Session <span class="text-red-500">*</span></label>
                    <input type="text" name="session" value="{{ donor.session }}" required
                           class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>

            <!-- Blood Group & Phone Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Blood Group <span class="text-red-500">*</span></label>
                    <select name="blood_group" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white">
                        {% for bg in blood_groups %}
                            <option value="{{ bg }}" {% if donor.blood_group == bg %}selected{% endif %}>{{ bg }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Contact Phone <span class="text-red-500">*</span></label>
                    <input type="tel" name="phone" value="{{ donor.phone }}" required
                           class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            </div>

            <!-- Last Donation & Total Donations Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Last Donation Date</label>
                    <input type="date" name="last_donation_date"
                           value="{% if donor.last_donation_date %}{{ donor.last_donation_date }}{% endif %}"
                           class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <p class="text-xs text-gray-400 mt-1">Leave blank if no info / N/A</p>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Total Times Donated</label>
                    <input type="number" name="total_donations" value="{% if donor.total_donations is not none and donor.total_donations != '' %}{{ donor.total_donations }}{% endif %}" min="0" placeholder="Leave blank for N/A"
                           class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <p class="text-xs text-gray-400 mt-1">Leave blank if no info / N/A</p>
                </div>
            </div>

            <!-- Badhon Member & Availability Checkboxes -->
            <div class="bg-gray-50 p-4 rounded-xl space-y-3 border border-gray-200">
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" name="is_badhon_member" value="1" {% if donor.is_badhon_member %}checked{% endif %} class="w-4 h-4 text-purple-600 rounded focus:ring-purple-500">
                    <div>
                        <span class="text-sm font-bold text-gray-800">Member of Badhon</span>
                        <p class="text-xs text-gray-500">Check if this donor is an official member of Badhon organization.</p>
                    </div>
                </label>

                <hr class="border-gray-200">

                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" name="is_available" value="1" {% if donor.is_available %}checked{% endif %} class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
                    <div>
                        <span class="text-sm font-bold text-gray-800">Currently Available to Donate</span>
                        <p class="text-xs text-gray-500">Uncheck if donor is currently unavailable.</p>
                    </div>
                </label>
            </div>

            <!-- Buttons -->
            <div class="pt-4 flex items-center justify-end space-x-3">
                <a href="{{ url_for('index') }}" class="px-5 py-2.5 text-sm font-semibold text-gray-600 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 text-sm font-bold bg-brand-600 hover:bg-brand-700 text-white rounded-lg transition shadow flex items-center space-x-2">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span>Update Record</span>
                </button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
